# scripts/check.conf — verification contract for ad-reels-skipper
# One step per line: <name>: <command> — runs in order, fails fast.
# Tag quick steps with [fast] in the NAME (never in the command).

# resource hygiene: no Gradle daemon
requires test: ./gradlew -v
test [fast]: sh -c 'if [ -z "$ANDROID_HOME" ] && [ -d "/opt/homebrew/share/android-commandlinetools" ]; then export ANDROID_HOME=/opt/homebrew/share/android-commandlinetools; fi; ./gradlew testDebugUnitTest --no-daemon'

# resource hygiene: no Gradle daemon
requires lint: ./gradlew -v
lint [fast]: sh -c 'if [ -z "$ANDROID_HOME" ] && [ -d "/opt/homebrew/share/android-commandlinetools" ]; then export ANDROID_HOME=/opt/homebrew/share/android-commandlinetools; fi; ./gradlew lintDebug --no-daemon'

# resource hygiene: no Gradle daemon
requires build: ./gradlew -v
build: sh -c 'if [ -z "$ANDROID_HOME" ] && [ -d "/opt/homebrew/share/android-commandlinetools" ]; then export ANDROID_HOME=/opt/homebrew/share/android-commandlinetools; fi; ./gradlew assembleDebug --no-daemon'
