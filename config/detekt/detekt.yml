build:
  maxIssues: 0

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 35
    ignoreAnnotated: ['Composable', 'Test']
  LongMethod:
    active: true
    threshold: 160
    ignoreAnnotated: ['Composable', 'Test']
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 20
  NestedBlockDepth:
    active: true
    threshold: 6
  ComplexCondition:
    active: true
    threshold: 5

exceptions:
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  SwallowedException:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable', 'Test']
    excludeClassPattern: '.*Test$'
  MatchingDeclarationName:
    active: false

performance:
  SpreadOperator:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 160
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 8
    excludeGuardClauses: true
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 3
