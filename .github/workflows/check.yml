name: Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew and scripts
        run: chmod +x gradlew scripts/*

      - name: Run ANEW verification check
        run: ./scripts/check

  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for shipped-spec diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew and scripts
        run: chmod +x gradlew scripts/*

      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict

      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest
